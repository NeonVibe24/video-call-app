name = "video-call-app"

main = "worker.js"

compatibility_date = "2026-09-08"


# ============================================================
# OBSERVABILITY
# ============================================================

[observability.logs]

enabled = true

head_sampling_rate = 1

invocation_logs = true

persist = true


[observability.traces]

enabled = false

head_sampling_rate = 1

persist = true


[observability]

enabled = false


# ============================================================
# STATIC ASSETS
# ============================================================

[assets]

# index.html
# style.css
# app.js
# are in the project root.

directory = "."

binding = "ASSETS"

# API requests are handled by worker.js.
run_worker_first = ["/api/*"]


# ============================================================
# DURABLE OBJECT
# ============================================================

# Worker code:
#
# export class CallSignal { ... }
#
# Environment binding:
#
# env.CALL_SIGNAL
#
# These two names MUST match.
# ============================================================

[[durable_objects.bindings]]

name = "CALL_SIGNAL"

class_name = "CallSignal"


# ============================================================
# DURABLE OBJECT SQLITE STORAGE
# ============================================================

# New Durable Objects use SQLite storage.
# This is NOT D1.
#
# The CallSignal Durable Object uses its own storage:
#
# this.state.storage
#
# ============================================================

[[migrations]]

tag = "v1"

new_sqlite_classes = [
    "CallSignal"
]
