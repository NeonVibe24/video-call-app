<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1 Video Call</title>
    <link rel="stylesheet" href="style.css">
</head><body><div class="app"><header class="header">
    <div class="brand">
        <div class="brand-icon">V</div>
        <div>
            <h1>Video Call</h1>
            <span>Private 1 vs 1</span>
        </div>
    </div>

    <div class="online">
        <span></span>
        Ready
    </div>
</header>


<main>

    <section class="home" id="home">

        <div class="hero-icon">
            📹
        </div>

        <h2>1 vs 1 Video Call</h2>

        <p class="description">
            Create a private room and share the room code
            with the person you want to call.
        </p>


        <div class="card">

            <label for="roomInput">
                Room Code
            </label>

            <input
                id="roomInput"
                type="text"
                placeholder="Enter room code"
                autocomplete="off"
                maxlength="50"
            >

            <button id="joinBtn" class="primary">
                Join Video Call
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <button id="createBtn" class="secondary">
                Create New Room
            </button>

        </div>

        <div class="info">
            <div>🔒</div>
            <p>
                Your room code is used to connect only you
                and the person you share it with.
            </p>
        </div>

    </section>


    <section class="call" id="call">

        <div class="call-header">

            <button id="backBtn" class="back">
                ←
            </button>

            <div>
                <strong>Private Call</strong>
                <small id="roomLabel"></small>
            </div>

            <button id="copyBtn" class="copy">
                Copy Room
            </button>

        </div>


        <div id="meet"></div>

    </section>

</main>

</div><script src="https://8x8.vc/YOUR_APP_ID/external_api.js"></script><script src="app.js"></script></body>
</html>
