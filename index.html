<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>1v1 Video Call</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="brand">
            <div class="logo">V</div>

            <div>
                <div class="title">
                    Video Call
                </div>

                <div class="subtitle">
                    Private 1 vs 1
                </div>
            </div>
        </div>

        <div class="status">
            <span></span>
            Ready
        </div>

    </header>


    <main>

        <!-- HOME -->

        <section
            id="homeScreen"
            class="home-screen"
        >

            <div class="hero">

                <div class="hero-icon">
                    📹
                </div>

                <h1>
                    1 vs 1 Video Call
                </h1>

                <p>
                    Create a private room or enter a room
                    code to start a video call.
                </p>

            </div>


            <div class="card">

                <label>
                    Your Name
                </label>

                <input
                    id="nameInput"
                    type="text"
                    maxlength="40"
                    placeholder="Enter your name"
                    autocomplete="name"
                >


                <label class="room-label">
                    Room Code
                </label>

                <input
                    id="roomInput"
                    type="text"
                    maxlength="40"
                    placeholder="Enter room code"
                    autocomplete="off"
                >


                <button
                    id="joinButton"
                    class="primary-button"
                >
                    Join Video Call
                </button>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button
                    id="createButton"
                    class="secondary-button"
                >
                    Create New Room
                </button>

            </div>


            <div class="notice">

                <div class="notice-icon">
                    🔒
                </div>

                <div>
                    <strong>
                        Private 1 vs 1 room
                    </strong>

                    <p>
                        Share the room code with only
                        the person you want to call.
                    </p>
                </div>

            </div>

        </section>


        <!-- CALL -->

        <section
            id="callScreen"
            class="call-screen"
        >

            <div class="call-topbar">

                <button
                    id="backButton"
                    class="back-button"
                >
                    ←
                </button>


                <div class="call-info">

                    <strong>
                        Private Call
                    </strong>

                    <span id="roomLabel">
                        -
                    </span>

                </div>


                <button
                    id="copyButton"
                    class="copy-button"
                >
                    Copy Room
                </button>

            </div>


            <div
                id="meet"
                class="meet-container"
            ></div>

        </section>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
