<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>1v1 Video Call</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="logo">
                V
            </div>

            <div>

                <div class="title">
                    Video Call
                </div>

                <div class="subtitle">
                    Private 1 vs 1
                </div>

            </div>

        </div>


        <div class="status">

            <span></span>

            Ready

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             HOME
        ================================================== -->

        <section
            id="homeScreen"
            class="home-screen"
        >


            <!-- =============================================
                 HERO
            ============================================== -->

            <div class="hero">

                <div class="hero-icon">
                    📹
                </div>


                <h1>
                    1 vs 1 Video Call
                </h1>


                <p>
                    Create a private room or enter a room
                    code to start a video call.
                </p>

            </div>



            <!-- =============================================
                 USER CARD
            ============================================== -->

            <div class="card">


                <!-- =========================================
                     NAME
                ========================================== -->

                <label>
                    Your Name
                </label>


                <input
                    id="nameInput"
                    type="text"
                    maxlength="40"
                    placeholder="Enter your name"
                    autocomplete="name"
                >



                <!-- =========================================
                     USER ID
                ========================================== -->

                <label
                    class="room-label"
                >
                    Your User ID
                </label>


                <div
                    style="
                        display:flex;
                        gap:8px;
                        align-items:center;
                    "
                >

                    <input
                        id="myUserIdInput"
                        type="text"
                        readonly
                        style="
                            flex:1;
                            opacity:.8;
                            font-size:12px;
                        "
                    >


                    <button
                        id="copyUserIdButton"
                        type="button"
                        class="secondary-button"
                        style="
                            width:auto;
                            white-space:nowrap;
                            padding:12px 14px;
                        "
                    >
                        Copy
                    </button>

                </div>



                <!-- =========================================
                     CALL USER
                ========================================== -->

                <label
                    class="room-label"
                >
                    Call User
                </label>


                <input
                    id="receiverIdInput"
                    type="text"
                    maxlength="100"
                    placeholder="Enter receiver User ID"
                    autocomplete="off"
                >


                <input
                    id="receiverNameInput"
                    type="text"
                    maxlength="40"
                    placeholder="Receiver name (optional)"
                    autocomplete="off"
                >


                <button
                    id="callUserButton"
                    class="primary-button"
                    type="button"
                >
                    📞 Call User
                </button>



                <!-- =========================================
                     DIVIDER
                ========================================== -->

                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>



                <!-- =========================================
                     ROOM CODE
                ========================================== -->

                <label
                    class="room-label"
                >
                    Room Code
                </label>


                <input
                    id="roomInput"
                    type="text"
                    maxlength="40"
                    placeholder="Enter room code"
                    autocomplete="off"
                >


                <button
                    id="joinButton"
                    class="primary-button"
                    type="button"
                >
                    Join Video Call
                </button>


                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <button
                    id="createButton"
                    class="secondary-button"
                    type="button"
                >
                    Create New Room
                </button>

            </div>



            <!-- =============================================
                 NOTICE
            ============================================== -->

            <div class="notice">

                <div class="notice-icon">
                    🔒
                </div>


                <div>

                    <strong>
                        Private 1 vs 1 room
                    </strong>


                    <p>
                        Share your User ID with the person
                        who wants to call you.
                    </p>

                </div>

            </div>

        </section>



        <!-- =================================================
             CALL SCREEN
        ================================================== -->

        <section
            id="callScreen"
            class="call-screen"
        >


            <div class="call-topbar">


                <button
                    id="backButton"
                    class="back-button"
                    type="button"
                >
                    ←
                </button>



                <div class="call-info">

                    <strong>
                        Private Call
                    </strong>


                    <span id="roomLabel">
                        -
                    </span>

                </div>



                <button
                    id="copyButton"
                    class="copy-button"
                    type="button"
                >
                    Copy Room
                </button>

            </div>



            <div
                id="meet"
                class="meet-container"
            ></div>

        </section>

    </main>

</div>



<!-- =========================================================
     APP SCRIPT
========================================================== -->

<script src="app.js"></script>


<!-- =========================================================
     USER ID UI CONNECTION
     
     This connects the HTML to:
     
     window.getMyUserId()
     window.callUser()
========================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* ================================================
           USER ID
        ================================================= */

        const myUserIdInput =
            document.getElementById(
                "myUserIdInput"
            );


        if (
            myUserIdInput &&
            typeof window.getMyUserId ===
                "function"
        ) {

            myUserIdInput.value =
                window.getMyUserId();

        }



        /* ================================================
           COPY USER ID
        ================================================= */

        const copyUserIdButton =
            document.getElementById(
                "copyUserIdButton"
            );


        if (copyUserIdButton) {

            copyUserIdButton.addEventListener(
                "click",
                async function () {

                    const userId =
                        myUserIdInput.value;


                    if (!userId) {

                        return;

                    }


                    try {

                        await navigator.clipboard.writeText(
                            userId
                        );


                        const oldText =
                            copyUserIdButton.textContent;


                        copyUserIdButton.textContent =
                            "Copied!";


                        setTimeout(
                            function () {

                                copyUserIdButton.textContent =
                                    oldText;

                            },
                            1500
                        );


                    } catch (_) {

                        prompt(
                            "Copy your User ID:",
                            userId
                        );

                    }

                }
            );

        }



        /* ================================================
           CALL USER
        ================================================= */

        const callUserButton =
            document.getElementById(
                "callUserButton"
            );


        const receiverIdInput =
            document.getElementById(
                "receiverIdInput"
            );


        const receiverNameInput =
            document.getElementById(
                "receiverNameInput"
            );


        if (callUserButton) {

            callUserButton.addEventListener(
                "click",
                async function () {

                    const receiverId =
                        receiverIdInput.value.trim();


                    const receiverName =
                        receiverNameInput.value.trim();


                    if (!receiverId) {

                        alert(
                            "Please enter the receiver User ID."
                        );


                        receiverIdInput.focus();


                        return;

                    }


                    if (
                        typeof window.callUser !==
                            "function"
                    ) {

                        alert(
                            "Call system is not ready."
                        );


                        return;

                    }


                    callUserButton.disabled =
                        true;


                    try {

                        await window.callUser(
                            receiverId,
                            receiverName
                        );


                    } finally {

                        callUserButton.disabled =
                            false;

                    }

                }
            );

        }



        /* ================================================
           ENTER KEY
        ================================================= */

        if (receiverIdInput) {

            receiverIdInput.addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        callUserButton.click();

                    }

                }
            );

        }

    }
);

</script>


</body>

</html>
